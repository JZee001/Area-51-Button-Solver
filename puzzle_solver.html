<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8-Button Puzzle Solver</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
        }
        h1 {
            color: #1f4e78;
            margin-bottom: 10px;
        }
        p.subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }
        @media (max-width: 500px) {
            .buttons-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        .button-card {
            background: #fafbfc;
            border: 1px solid #e1e4e8;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .button-label {
            font-size: 12px;
            font-weight: 600;
            color: #586069;
            margin-bottom: 8px;
        }
        .puzzle-btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 2px solid rgba(0,0,0,0.1);
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            color: white;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            outline: none;
        }
        .puzzle-btn:active {
            transform: scale(0.95);
        }
        /* Colors: Red (0), Yellow (1), Green (2) */
        .color-0 { background-color: #d73a49; } /* Red */
        .color-1 { background-color: #dbab09; } /* Yellow */
        .color-2 { background-color: #28a745; } /* Green */

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 25px;
        }
        .btn-action {
            background-color: #1f4e78;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-action:hover {
            background-color: #153554;
        }
        .btn-secondary {
            background-color: #e1e4e8;
            color: #333;
        }
        .btn-secondary:hover {
            background-color: #c6cbd1;
        }
        .result-box {
            background: #f1f8ff;
            border: 1px solid #c8e1ff;
            border-radius: 8px;
            padding: 20px;
            text-align: left;
            margin-top: 20px;
        }
        .result-box h3 {
            margin-top: 0;
            color: #0366d6;
            font-size: 16px;
        }
        .parity-warning {
            color: #d73a49;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>8-Button Puzzle Solver</h1>
    <p class="subtitle">Click any button to cycle its color (Red &rarr; Yellow &rarr; Green). When your puzzle matches, click Solve!</p>

    <div class="buttons-grid" id="buttonsGrid">
        <!-- Generated dynamically via JS -->
    </div>

    <div class="controls">
        <button class="btn-action" onclick="solvePuzzle()">Find Shortest Solution</button>
        <button class="btn-action btn-secondary" onclick="resetPuzzle()">Reset to All Red</button>
    </div>

    <div class="result-box" id="resultBox" style="display: none;">
        <h3 id="resultTitle">Solution</h3>
        <p id="resultText"></p>
    </div>
</div>

<script>
    // 0 = Red, 1 = Yellow, 2 = Green
    let states = [0, 0, 0, 0, 0, 0, 0, 0];
    const colorNames = ["Red", "Yellow", "Green"];

    function render() {
        const grid = document.getElementById("buttonsGrid");
        grid.innerHTML = "";
        
        states.forEach((val, i) => {
            const card = document.createElement("div");
            card.className = "button-card";
            
            const label = document.createElement("div");
            label.className = "button-label";
            label.innerText = `Button ${i + 1}`;
            
            const btn = document.createElement("button");
            btn.className = `puzzle-btn color-${val}`;
            btn.innerText = colorNames[val].substring(0, 3);
            btn.title = `Click to cycle color (${colorNames[val]})`;
            btn.onclick = () => cycleColor(i);
            
            card.appendChild(label);
            card.appendChild(btn);
            grid.appendChild(card);
        });
    }

    function cycleColor(i) {
        states[i] = (states[i] + 1) % 3;
        render();
        document.getElementById("resultBox").style.display = "none";
    }

    function resetPuzzle() {
        states = [0, 0, 0, 0, 0, 0, 0, 0];
        render();
        document.getElementById("resultBox").style.display = "none";
    }

    function solvePuzzle() {
        const target = [2, 2, 2, 2, 2, 2, 2, 2];
        
        // Check if already solved
        if (arraysEqual(states, target)) {
            showResult("Already Solved!", "All buttons are already Green!");
            return;
        }

        // BFS solver
        let queue = [{state: [...states], path: []}];
        let visited = new Set();
        visited.add(states.toString());
        
        let solution = null;

        while (queue.length > 0) {
            let curr = queue.shift();
            
            for (let i = 0; i < 8; i++) {
                let nextState = [...curr.state];
                let left = (i - 1 + 8) % 8;
                let right = (i + 1) % 8;
                
                nextState[left] = (nextState[left] + 1) % 3;
                nextState[i] = (nextState[i] + 1) % 3;
                nextState[right] = (nextState[right] + 1) % 3;
                
                let nextStr = nextState.toString();
                let newPath = curr.path.concat([i + 1]);
                
                if (arraysEqual(nextState, target)) {
                    solution = newPath;
                    break;
                }
                
                if (!visited.has(nextStr)) {
                    visited.add(nextStr);
                    queue.push({state: nextState, path: newPath});
                }
            }
            if (solution) break;
        }

        const resBox = document.getElementById("resultBox");
        resBox.style.display = "block";

        if (solution) {
            showResult("Solution Found!", `Press buttons in this exact order:<br><br><strong>&rarr; Button ${solution.join(", Button ")}</strong><br><small style="color:#666">Total presses: ${solution.length}</small>`);
        } else {
            showResult("Unsolvable Configuration", `<span class="parity-warning">No solution exists for this starting configuration.</span> Due to the mathematical rules of this puzzle, this combination is in an unreachable state space. Try changing one or two buttons to Green or Yellow!`);
        }
    }

    function arraysEqual(a, b) {
        return a.length === b.length && a.every((val, index) => val === b[index]);
    }

    function showResult(title, htmlContent) {
        document.getElementById("resultTitle").innerHTML = title;
        document.getElementById("resultText").innerHTML = htmlContent;
    }

    // Initial render
    render();
</script>

</body>
</html>
